name: Android CI

# Keep only the newest run for a given pull request or branch.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev, dev-v3, planner-timer-v3, main]
  pull_request:
    branches: [dev, dev-v3, planner-timer-v3, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        id: assemble
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Upload debug APK
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
